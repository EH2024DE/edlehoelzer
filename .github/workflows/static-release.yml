name: Static release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edle-hoelzer-static-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned build and test dependencies
        run: npm ci --prefix tools/shop-server --ignore-scripts --no-fund
      - name: Test catalogue, inquiry, payment boundaries and static export
        run: node --test tests/*.test.cjs tests/*.test.mjs
      - name: Validate source indexability and public assets
        run: |
          node scripts/check-indexability.mjs
          node scripts/audit-assets.js
      - name: Build static release without payment activation
        run: node scripts/build-site.mjs "$RUNNER_TEMP/edle-hoelzer-release"
      - name: Validate all release links and export boundaries
        run: node scripts/check-release.mjs "$RUNNER_TEMP/edle-hoelzer-release"
