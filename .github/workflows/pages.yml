name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: Package static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Validate indexability signals
        run: node scripts/check-indexability.mjs

      - name: Audit public assets
        run: node scripts/audit-assets.js

      - name: Prepare static site
        run: |
          mkdir -p "${RUNNER_TEMP}/site"
          rsync -a \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="utm-links.md" \
            ./ "${RUNNER_TEMP}/site/"

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "${{ runner.temp }}/site"

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
