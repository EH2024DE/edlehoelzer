name: Validate static site

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate indexability signals
        run: node scripts/check-indexability.mjs

      - name: Audit public assets
        run: node scripts/audit-assets.js
