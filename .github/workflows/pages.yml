name: Validate static site

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install design build dependencies
        run: npm ci

      - name: Validate shared design and preserved page contracts
        run: npm run test:design-system

      - name: Build the complete static design for review
        run: node scripts/build-design-site.mjs "$RUNNER_TEMP/edle-design-site"

      - name: Audit linked typography in the generated design
        run: node scripts/audit-design-build.mjs "$RUNNER_TEMP/edle-design-site"

      - name: Audit internal destinations and fragments
        run: node scripts/audit-design-links.mjs "$RUNNER_TEMP/edle-design-site"

      - name: Save static design artifact without publishing
        uses: actions/upload-artifact@v4
        with:
          name: edle-design-site
          path: ${{ runner.temp }}/edle-design-site
          retention-days: 7

      - name: Validate indexability signals
        run: node scripts/check-indexability.mjs

      - name: Audit public assets
        run: node scripts/audit-assets.js

      - name: Validate page summaries
        run: node scripts/check-page-summaries.mjs

      - name: Validate board finder and gastronomy page
        run: node --test tests/finder-matching.test.cjs tests/gastronomie.test.cjs

      - name: Prepare public Pages files
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_DEPLOY_ENABLED == 'true'
        run: |
          site="$RUNNER_TEMP/edle-design-site"
          rm -rf "$site/design-reference" "$site/design-reference.json"
          cp CNAME .nojekyll "$site/"

      - name: Upload public Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_DEPLOY_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/edle-design-site

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_DEPLOY_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated site
        id: deployment
        uses: actions/deploy-pages@v4
