name: Validate Cloudflare staging without deployment

on:
  pull_request:
  push:
    branches: [codex/cloudflare-stripe-shop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci --prefix tools/shop-server --ignore-scripts --no-fund
      - run: npm ci --prefix tools/cloudflare-shop --ignore-scripts --no-fund
      - run: npm run test:cloudflare
      - name: Bundle staging Worker locally; never publish
        run: npm --prefix tools/cloudflare-shop run check
