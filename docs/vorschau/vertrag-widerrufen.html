<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Vertrag widerrufen | Edle Hölzer – Vorschau</title>
<style>
body{max-width:40rem;margin:3rem auto;padding:0 1.25rem;font:1rem/1.6 system-ui,sans-serif;color:#242521;background:#fafaf8}
label{display:block;margin-block:1rem}input,textarea{display:block;box-sizing:border-box;width:100%;padding:.6rem;border:1px solid #73766d;font:inherit}
button{min-height:44px;padding:.5rem 1rem;font:inherit;background:#42342b;color:white;border:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #526851;outline-offset:3px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}
</style>
<main>
  <h1>Vertrag widerrufen</h1>
  <p><strong>Interne Vorschau:</strong> Nur Beispieldaten eingeben. Es wird nichts übermittelt.</p>
  <form id="withdrawal">
    <label>Name <input name="customer" required maxlength="120" autocomplete="off"></label>
    <label>Bestellnummer oder andere Angaben zum Vertrag
      <textarea name="contract" required maxlength="500" rows="3"></textarea>
    </label>
    <label>E-Mail für die Eingangsbestätigung
      <input name="email" type="email" required maxlength="254" autocomplete="off">
    </label>
    <button type="submit" disabled>Widerruf prüfen</button>
  </form>
  <section id="review" hidden>
    <h2 tabindex="-1">Deine Widerrufserklärung</h2>
    <p>Hiermit widerrufe ich den nachfolgend bezeichneten Vertrag.</p>
    <pre id="summary"></pre>
    <button id="edit" type="button">Angaben ändern</button>
    <button id="confirm" type="button">Widerruf bestätigen (Test)</button>
  </section>
  <p id="result" role="status"></p>
</main>
<script>
const form = document.querySelector('#withdrawal');
const review = document.querySelector('#review');
const result = document.querySelector('#result');
const confirm = document.querySelector('#confirm');
form.addEventListener('submit', event => {
  event.preventDefault();
  const data = new FormData(form);
  document.querySelector('#summary').textContent =
    ['Name: ' + data.get('customer'), 'Vertrag: ' + data.get('contract'),
     'Bestätigung an: ' + data.get('email')].join('\n');
  result.textContent = '';
  confirm.disabled = false;
  form.hidden = true;
  review.hidden = false;
  review.querySelector('h2').focus();
});
document.querySelector('#edit').addEventListener('click', () => {
  review.hidden = true;
  form.hidden = false;
  form.elements.customer.focus();
});
confirm.addEventListener('click', () => {
  result.textContent = 'Test beendet. Es wurde kein Widerruf übermittelt und keine E-Mail verschickt.';
  confirm.disabled = true;
});
form.querySelector('button').disabled = false;
</script>
</html>
